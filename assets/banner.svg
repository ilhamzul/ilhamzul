<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="880" height="240" role="img" aria-label="Ilham Zulfikri Firdaus - Anime GitHub Banner">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16161E" />
      <stop offset="55%" stop-color="#1A1B26" />
      <stop offset="100%" stop-color="#24283B" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BB9AF7" />
      <stop offset="50%" stop-color="#F7768E" />
      <stop offset="100%" stop-color="#7DCFFF" />
    </linearGradient>
    <linearGradient id="glowTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C0CAF5" />
      <stop offset="55%" stop-color="#BB9AF7" />
      <stop offset="100%" stop-color="#F7768E" />
    </linearGradient>
    <radialGradient id="orbSakura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F7768E" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#F7768E" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orbCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7DCFFF" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#7DCFFF" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#414868" stroke-width="0.6" stroke-opacity="0.35" />
    </pattern>
    <clipPath id="cardClip">
      <rect x="2" y="2" width="876" height="236" rx="16" />
    </clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.75; }
        50% { transform: translateY(10px) rotate(16deg); opacity: 1; }
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 0.95; }
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      .petal-1 { animation: floatSlow 5.2s ease-in-out infinite; transform-origin: center; }
      .petal-2 { animation: floatSlow 6.4s ease-in-out 1.1s infinite; transform-origin: center; }
      .petal-3 { animation: floatSlow 4.8s ease-in-out 2.0s infinite; transform-origin: center; }
      .star-1 { animation: twinkle 3.1s ease-in-out infinite; }
      .star-2 { animation: twinkle 4.0s ease-in-out 1.2s infinite; }
      .dot-live { animation: pulseDot 1.8s ease-in-out infinite; }
    </style>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="880" height="240" fill="url(#bgGrad)" />
    <rect width="880" height="240" fill="url(#grid)" />

    <!-- Soft ambient neon orbs -->
    <circle cx="760" cy="60" r="150" fill="url(#orbSakura)" />
    <circle cx="130" cy="210" r="130" fill="url(#orbCyan)" />

    <!-- Twinkling stars -->
    <circle class="star-1" cx="620" cy="48" r="2" fill="#7DCFFF" />
    <circle class="star-2" cx="685" cy="92" r="1.6" fill="#BB9AF7" />
    <circle class="star-1" cx="735" cy="36" r="2.2" fill="#F7768E" />
    <circle class="star-2" cx="822" cy="145" r="1.8" fill="#E0AF68" />
    <circle class="star-1" cx="555" cy="186" r="1.5" fill="#7DCFFF" />

    <!-- Floating sakura petals -->
    <g class="petal-1" transform="translate(765, 55)">
      <path d="M0,-9 C5,-5 8,2 0,9 C-8,2 -5,-5 0,-9 Z" fill="#F7768E" fill-opacity="0.72" />
    </g>
    <g class="petal-2" transform="translate(812, 102) rotate(28)">
      <path d="M0,-7 C4,-4 6,2 0,7 C-6,2 -4,-4 0,-7 Z" fill="#FF9E64" fill-opacity="0.58" />
    </g>
    <g class="petal-3" transform="translate(705, 165) rotate(-18)">
      <path d="M0,-8 C4.5,-4 7,2 0,8 C-7,2 -4.5,-4 0,-8 Z" fill="#BB9AF7" fill-opacity="0.65" />
    </g>
    <g class="petal-2" transform="translate(658, 128) rotate(42)">
      <path d="M0,-6 C3.5,-3 5,1.5 0,6 C-5,1.5 -3.5,-3 0,-6 Z" fill="#F7768E" fill-opacity="0.5" />
    </g>

    <!-- Stylized decorative Japanese katana/sparkle emblem on the right -->
    <g transform="translate(758, 124)" opacity="0.92">
      <circle cx="0" cy="0" r="48" fill="none" stroke="#414868" stroke-width="1.2" stroke-dasharray="5 5" />
      <circle cx="0" cy="0" r="36" fill="#1F2335" stroke="#BB9AF7" stroke-width="1.5" stroke-opacity="0.7" />
      <text x="0" y="7" text-anchor="middle" class="sans" font-size="22" font-weight="700" fill="#F7768E">限界突破</text>
      <text x="0" y="25" text-anchor="middle" class="mono" font-size="8.5" fill="#7DCFFF" letter-spacing="1.5">PLUS ULTRA</text>
    </g>

    <!-- Top badge bar -->
    <rect x="38" y="32" width="232" height="26" rx="13" fill="#24283B" stroke="#BB9AF7" stroke-opacity="0.5" stroke-width="1" />
    <circle class="dot-live" cx="54" cy="45" r="4" fill="#9ECE6A" />
    <text x="66" y="49" class="mono" font-size="11.5" font-weight="600" fill="#A9B1D6">いらっしゃいませ // WELCOME</text>

    <!-- Status pill on top right -->
    <rect x="646" y="32" width="196" height="26" rx="13" fill="#1F2335" stroke="#414868" stroke-width="1" />
    <text x="744" y="49" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#9ECE6A">ONLINE · CAFFEINE 99%</text>

    <!-- Hero Title & Tagline -->
    <text x="38" y="108" class="sans" font-size="36" font-weight="800" fill="url(#glowTitle)" letter-spacing="-0.5">
      Yo, I'm Ilham (ilhamzul)
    </text>
    <text x="38" y="142" class="sans" font-size="16" font-weight="600" fill="#C0CAF5">
      Data PM @ Shopee (SEA Regional Marketing) by day
    </text>
    <text x="38" y="167" class="sans" font-size="15.5" font-weight="500" fill="#7DCFFF">
      Certified weeb building gloriously stupid stuff on my free time by night
    </text>

    <!-- Bottom quick tags -->
    <rect x="38" y="188" width="136" height="24" rx="6" fill="#24283B" stroke="#414868" stroke-width="1" />
    <text x="106" y="204" text-anchor="middle" class="mono" font-size="11" fill="#BB9AF7">Jakarta / ID</text>

    <rect x="184" y="188" width="174" height="24" rx="6" fill="#24283B" stroke="#414868" stroke-width="1" />
    <text x="271" y="204" text-anchor="middle" class="mono" font-size="11" fill="#F7768E">Ex-TikTok Shop &amp; Tokopedia</text>

    <rect x="368" y="188" width="174" height="24" rx="6" fill="#24283B" stroke="#414868" stroke-width="1" />
    <text x="455" y="204" text-anchor="middle" class="mono" font-size="11" fill="#E0AF68">Class: Data PM / DS</text>
  </g>

  <!-- Crisp neon outer frame -->
  <rect x="1.5" y="1.5" width="877" height="237" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="2" stroke-opacity="0.8" />
</svg>
