<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="880" height="240" role="img" aria-label="Ilham Zulfikri - Neo-Chinese AI Era Banner">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0F17" />
      <stop offset="55%" stop-color="#11131C" />
      <stop offset="100%" stop-color="#1B1E2E" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="52%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>
    <radialGradient id="orbCrimson" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orbJade" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#2D334D" stroke-width="0.6" stroke-opacity="0.4" />
    </pattern>
    <clipPath id="cardClip">
      <rect x="2" y="2" width="876" height="236" rx="16" />
    </clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      @keyframes floatPlum {
        0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.72; }
        50% { transform: translateY(10px) rotate(14deg); opacity: 1; }
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 0.95; }
      }
      @keyframes pulseJade {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      .petal-1 { animation: floatPlum 5.4s ease-in-out infinite; transform-origin: center; }
      .petal-2 { animation: floatPlum 6.6s ease-in-out 1.1s infinite; transform-origin: center; }
      .petal-3 { animation: floatPlum 4.9s ease-in-out 2.0s infinite; transform-origin: center; }
      .star-1 { animation: twinkle 3.2s ease-in-out infinite; }
      .star-2 { animation: twinkle 4.1s ease-in-out 1.3s infinite; }
      .dot-live { animation: pulseJade 1.8s ease-in-out infinite; }
    </style>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="880" height="240" fill="url(#bgGrad)" />
    <rect width="880" height="240" fill="url(#grid)" />

    <circle cx="760" cy="64" r="155" fill="url(#orbCrimson)" />
    <circle cx="140" cy="212" r="135" fill="url(#orbJade)" />

    <circle class="star-1" cx="622" cy="46" r="2" fill="#34D399" />
    <circle class="star-2" cx="686" cy="88" r="1.7" fill="#F59E0B" />
    <circle class="star-1" cx="734" cy="36" r="2.2" fill="#F43F5E" />
    <circle class="star-2" cx="826" cy="148" r="1.8" fill="#34D399" />
    <circle class="star-1" cx="566" cy="184" r="1.6" fill="#F59E0B" />

    <!-- Drifting plum blossom petals -->
    <g class="petal-1" transform="translate(768, 52)">
      <path d="M0,-9 C5,-5 8,2 0,9 C-8,2 -5,-5 0,-9 Z" fill="#F43F5E" fill-opacity="0.78" />
    </g>
    <g class="petal-2" transform="translate(816, 100) rotate(26)">
      <path d="M0,-7 C4,-4 6,2 0,7 C-6,2 -4,-4 0,-7 Z" fill="#F59E0B" fill-opacity="0.62" />
    </g>
    <g class="petal-3" transform="translate(706, 168) rotate(-18)">
      <path d="M0,-8 C4.5,-4 7,2 0,8 C-7,2 -4.5,-4 0,-8 Z" fill="#F43F5E" fill-opacity="0.62" />
    </g>
    <g class="petal-2" transform="translate(658, 128) rotate(38)">
      <path d="M0,-6 C3.5,-3 5,1.5 0,6 C-5,1.5 -3.5,-3 0,-6 Z" fill="#34D399" fill-opacity="0.52" />
    </g>

    <!-- Neo-Chinese Cyber Seal Emblem -->
    <g transform="translate(758, 126)">
      <circle cx="0" cy="0" r="50" fill="none" stroke="#F59E0B" stroke-opacity="0.45" stroke-width="1.2" stroke-dasharray="5 5" />
      <rect x="-38" y="-38" width="76" height="76" rx="14" fill="#171A26" stroke="#F43F5E" stroke-width="1.6" stroke-opacity="0.85" />
      <rect x="-32" y="-32" width="64" height="64" rx="10" fill="none" stroke="#F59E0B" stroke-width="0.9" stroke-opacity="0.55" />
      <text x="0" y="6" text-anchor="middle" class="sans" font-size="24" font-weight="800" fill="#F43F5E">破界</text>
      <text x="0" y="23" text-anchor="middle" class="mono" font-size="8.5" font-weight="700" fill="#34D399" letter-spacing="1.4">AI ERA</text>
    </g>

    <!-- Top badges -->
    <rect x="38" y="30" width="218" height="26" rx="13" fill="#1B1E2E" stroke="#F59E0B" stroke-opacity="0.55" stroke-width="1" />
    <circle class="dot-live" cx="54" cy="43" r="4" fill="#34D399" />
    <text x="66" y="47" class="mono" font-size="11.5" font-weight="700" fill="#E2E8F0">欢迎光临 // WELCOME</text>

    <rect x="628" y="30" width="214" height="26" rx="13" fill="#171A26" stroke="#2D334D" stroke-width="1" />
    <text x="735" y="47" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#34D399">VENTUBOX: BUILDING_AI</text>

    <!-- Main title & subtitle -->
    <text x="38" y="106" class="sans" font-size="35" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.5">
      Yo, I'm Ilham (ilhamzul)
    </text>
    <text x="38" y="140" class="sans" font-size="15.5" font-weight="700" fill="#F1F5F9">
      Data PM @ Shopee (SEA Regional Marketing) · Building Ventubox
    </text>
    <text x="38" y="165" class="sans" font-size="15" font-weight="500" fill="#34D399">
      Shipping AI products &amp; playful apps after hours — CV bots, Hanzi &amp; kids tools
    </text>

    <!-- Bottom tags -->
    <rect x="38" y="188" width="132" height="24" rx="6" fill="#1B1E2E" stroke="#2D334D" stroke-width="1" />
    <text x="104" y="204" text-anchor="middle" class="mono" font-size="11" fill="#FCD34D">Jakarta · SEA</text>

    <rect x="180" y="188" width="184" height="24" rx="6" fill="#1B1E2E" stroke="#2D334D" stroke-width="1" />
    <text x="272" y="204" text-anchor="middle" class="mono" font-size="11" fill="#F43F5E">Studio: Ventubox (Stealth)</text>

    <rect x="374" y="188" width="194" height="24" rx="6" fill="#1B1E2E" stroke="#2D334D" stroke-width="1" />
    <text x="471" y="204" text-anchor="middle" class="mono" font-size="11" fill="#34D399">Ex-ByteDance &amp; Tokopedia</text>
  </g>

  <rect x="1.5" y="1.5" width="877" height="237" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="2" stroke-opacity="0.82" />
</svg>
