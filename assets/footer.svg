    <linearGradient id="footBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A1B26" />
      <stop offset="50%" stop-color="#24283B" />
      <stop offset="100%" stop-color="#1A1B26" />
    </linearGradient>
    <linearGradient id="footBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7DCFFF" />
      <stop offset="50%" stop-color="#F7768E" />
      <stop offset="100%" stop-color="#BB9AF7" />
